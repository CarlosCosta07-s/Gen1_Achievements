name: Validate achievement catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog and translations
        run: python tests/validate_catalog.py
      - name: Validate event payload contract
        run: python tests/validate_engine_contract.py
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Check Lua syntax
        run: |
          luajit -b main.lua /tmp/gen1-achievements.luac
          luajit -b addons/fullscreen_fit/main.lua /tmp/fullscreen-fit.luac
      - name: Execute achievement runtime harness
        run: luajit tests/runtime_harness.lua
      - name: Execute fullscreen fit harness
        run: luajit tests/fullscreen_fit_harness.lua
